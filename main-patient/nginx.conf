server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API proxies used by the production Vite build.
    location /api/auth/ {
        proxy_pass ${AUTH_PROXY_TARGET}/;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/backend/ {
        proxy_pass ${BACKEND_PROXY_TARGET}/;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/dpd/ { proxy_pass ${DPD_PROXY_TARGET}/; proxy_ssl_server_name on; proxy_set_header Host $proxy_host; }
    location /api/swintiny/ { proxy_pass ${SWINTINY_PROXY_TARGET}/; proxy_ssl_server_name on; proxy_set_header Host $proxy_host; }
    location /api/clip-vitb16/ { proxy_pass ${CLIP_VITB16_PROXY_TARGET}/; proxy_ssl_server_name on; proxy_set_header Host $proxy_host; }
    location /api/chat-service/ {
        proxy_pass ${CHAT_SERVICE_TARGET}/;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
    }
    location /api/transcription/ { proxy_pass ${TRANSCRIPTION_PROXY_TARGET}/; }
    location /api/sms/ { proxy_pass ${SMS_PROXY_TARGET}/; }
    location /api/chatbox/ {
        proxy_pass ${CHATBOX_PROXY_TARGET}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback - all routes handled by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
